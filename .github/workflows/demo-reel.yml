name: Capture VEKAID product demo
on:
  push:
    branches: ['demo/reel-english-v23-22']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - run: |
          python3 -m http.server 8765 > /tmp/reel-server.log 2>&1 &
          node demo/reel.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VEKAID-English-Reel
          path: capture/
          retention-days: 7
