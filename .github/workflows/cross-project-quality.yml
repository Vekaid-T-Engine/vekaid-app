name: Cross-project quality
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
jobs:
  static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node tests/cross-project-quality.cjs
