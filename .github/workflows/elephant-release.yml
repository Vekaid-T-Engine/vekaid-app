name: Compile Elephant delivery
on:
  push:
    branches: [release/elephant-protected]
    paths: [.github/workflows/elephant-release.yml]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p /tmp/elephant-build
          cd /tmp/elephant-build
          npm install --ignore-scripts --no-audit --no-fund html-minifier-terser@7.2.0 clean-css@5.3.3 terser@5.39.0
          cat > build.mjs <<'EOF'
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {minify as html} from 'html-minifier-terser';
          import CleanCSS from 'clean-css';
          import {minify as js} from 'terser';
          const root=process.env.GITHUB_WORKSPACE+'/demos/like-an-elephant/';
          for(const n of await readdir(root)){
            if(!/^(organic|premium)-.*\.html$/.test(n))continue;
            await writeFile(root+n,await html(await readFile(root+n,'utf8'),{removeComments:true,collapseWhitespace:true,conservativeCollapse:true,removeAttributeQuotes:false}));
          }
          for(const n of ['restaurant-40.css','cinematic-preview.css','organic-preview.css','organic-site.css','premium-v2.css','press-editorial.css']){
            const p=root+'assets/'+n;const x=new CleanCSS({level:1}).minify(await readFile(p,'utf8'));if(x.errors.length)throw Error(x.errors.join(';'));await writeFile(p,x.styles);
          }
          const x=await js(await readFile(root+'assets/restaurant-40.js','utf8'),{compress:true,mangle:{toplevel:true},format:{comments:false},sourceMap:false});
          if(!x.code)throw Error('Empty output');await writeFile(root+'assets/restaurant-preview.min.js',x.code);
          EOF
          node build.mjs
          cd "$GITHUB_WORKSPACE"
          node --check demos/like-an-elephant/assets/restaurant-preview.min.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add demos/like-an-elephant
          git rm .github/workflows/elephant-release.yml
          git commit -m "Publish compiled Elephant delivery only"
          git push origin HEAD:release/elephant-protected
