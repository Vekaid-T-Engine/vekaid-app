name: Expand localization coverage
on:
  push:
    branches: ['engineering/locale-coverage-v2340']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        locale: [en, de, zh-Hans, es, it, pt, ja, ko, ar, ru, hi, tr, vi, nl, id]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock acorn@8 acorn-walk@8
      - run: node scripts/inventory-locales.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install argostranslate==1.11.0 beautifulsoup4
      - run: python scripts/expand-locales.py "${{ matrix.locale }}"
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-${{ matrix.locale }}
          path: locales/${{ matrix.locale }}.json
          if-no-files-found: error
  verify:
    needs: translate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: expanded-*
          merge-multiple: true
          path: locales
      - run: node tests/generated-locales.cjs && node tests/legacy-lab.cjs && node tests/coverage-required.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.json
          if-no-files-found: error
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locales coverage-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Expand 15 locale packs with regression inventory'
          git push origin HEAD:${{ github.ref_name }}
