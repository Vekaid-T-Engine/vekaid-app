name: Security scan
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python static security scan
        run: |
          python -m pip install bandit==1.8.6
          bandit -r tools -f json -o /tmp/bandit.json -ll -ii
          python -c "import json; d=json.load(open('/tmp/bandit.json')); assert not d['errors'], d['errors']"
      - name: ZAP passive scan on isolated static copy
        if: always()
        run: |
          mkdir -p /tmp/vekaid-scan/vekaid-app /tmp/zap-report
          git archive HEAD | tar -x -C /tmp/vekaid-scan/vekaid-app
          python -m http.server 8766 --bind 127.0.0.1 --directory /tmp/vekaid-scan >/tmp/vekaid-http.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8766/vekaid-app/ >/dev/null
          chmod 777 /tmp/zap-report
          set +e
          docker run --rm --network host -v /tmp/zap-report:/zap/wrk:rw ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af zap-baseline.py -t http://127.0.0.1:8766/vekaid-app/ -m 1 -J zap.json -r zap.html
          rc=$?
          set -e
          test -s /tmp/zap-report/zap.json
          if [ "$rc" = 2 ]; then
            echo '::warning::ZAP passive warnings require review; report retained. No FAIL rules reported.'
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-scan-reports
          path: |
            /tmp/bandit.json
            /tmp/zap-report/
          retention-days: 7
