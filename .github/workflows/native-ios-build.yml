name: Native iOS build
on:
  pull_request:
    paths:
      - 'ios-native/**'
      - '.github/workflows/native-ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode
        run: xcodebuild -version && xcrun simctl list devices available
      - name: Compile SwiftUI package for iOS Simulator
        run: xcodebuild -scheme VEKAIDNative -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test on available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -scheme VEKAIDNative -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
