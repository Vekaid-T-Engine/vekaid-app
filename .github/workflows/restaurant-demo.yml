name: Restaurant demo quality
on:
  pull_request:
    paths: ['demos/like-an-elephant/**', '.github/workflows/restaurant-demo.yml']
  push:
    branches: [main]
    paths: ['demos/like-an-elephant/**', '.github/workflows/restaurant-demo.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check demos/like-an-elephant/assets/site.js && node --check demos/like-an-elephant/assets/content.js
      - run: python demos/like-an-elephant/tests/check.py
      - run: node --check demos/like-an-elephant/assets/restaurant-41.js
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: NODE_PATH=$PWD/node_modules node demos/like-an-elephant/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restaurant-v41-browser-captures
          path: restaurant-*.png
