name: Generate offline translations
on:
  push:
    branches: ['engineering/argos-localization']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install argostranslate beautifulsoup4
      - run: python scripts/generate-locales.py es
      - uses: actions/upload-artifact@v4
        with:
          name: offline-es-pilot
          path: locales/es.json
