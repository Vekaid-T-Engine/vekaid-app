name: VEKAID Guardian
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - v23-core.js
      - v23.css
      - index.html
      - live-intelligence.js
      - live-locales.js
      - tests/accessibility-browser.cjs
      - .github/workflows/guardian.yml
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: node tests/accessibility-browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-mobile-report
          path: accessibility-report.json
      - run: node --test tests/live-intelligence.test.cjs
      - run: python -m unittest discover -s tests -p test_live_bridge.py -v
