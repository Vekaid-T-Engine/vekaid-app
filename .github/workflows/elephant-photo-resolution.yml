name: Original photo resolution audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow==11.3.0
      - shell: python
        run: |
          import re, json, urllib.request, io
          from PIL import Image
          from pathlib import Path
          source=Path('demos/like-an-elephant/assets/restaurant-40.js').read_text()
          photos=json.loads(re.search(r'const PHOTO_DATA=(\[.*?\]);',source).group(1))
          rows=[]
          for p in photos:
            try:
              req=urllib.request.Request(p['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as response:
                data=response.read(20000000)
              im=Image.open(io.BytesIO(data))
              w,h=im.size
              im.verify()
              row={'title':p['title'],'width':w,'height':h,'banner_candidate':w>=1600 and h>=800 and w/h>=1.5}
            except Exception as e:
              row={'title':p['title'],'error':str(e)}
            rows.append(row)
            print(json.dumps(row,ensure_ascii=False),flush=True)
          Path('photo-resolution.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          if not any('width' in r for r in rows):
            raise SystemExit('No source photos verified')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-resolution
          path: photo-resolution.json
