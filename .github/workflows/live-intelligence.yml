name: Live Intelligence checks
on:
  pull_request:
    paths:
      - live-intelligence.js
      - tests/live-intelligence.test.cjs
      - tests/test_live_bridge.py
      - tools/live_bridge.py
      - v23.css
      - index.html
      - service-worker.js
      - .github/workflows/live-intelligence.yml
  push:
    branches:
      - engineering/live-intelligence-v1
      - engineering/live-mobile-hotfix
      - main
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_live_bridge.py -v
      - run: node --check live-intelligence.js
      - run: node --test tests/live-intelligence.test.cjs
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("live-intelligence.js")
          assert p.stat().st_size <= 32000, "Monitor size budget exceeded"
          assert Path("v23-core.js").stat().st_size <= 100000, "Core size budget exceeded"
          assert "live-intelligence.js" in Path("index.html").read_text()
          assert "live-intelligence.js" in Path("service-worker.js").read_text()
          print("Independent size budgets and integration references OK")
          PY
