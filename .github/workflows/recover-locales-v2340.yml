name: Recover validated locale archives V23.40
on:
  push:
    branches: ['engineering/locale-recovery-v2340']
permissions:
  actions: read
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45591005680
          github-token: ${{ github.token }}
          pattern: expanded-*
          merge-multiple: true
          path: locales
      - run: node scripts/recover-arabic-v2340.cjs
      - name: All existing locale checks
        run: |
          node --check v23-core.js
          node --check service-worker.js
          node tests/localization.cjs
          node tests/generated-locales.cjs
          node tests/legacy-lab.cjs
          node tests/coverage-required.cjs
          node tests/academy-spacing.cjs
          node tests/refresh.cjs
          node tests/certifications.cjs
          node tests/playbook.cjs
          node tests/data-engineering.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-coverage-report
          path: coverage-report.json
      - name: Commit only validated packs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locales coverage-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Recover 15 existing packs and fix reviewed Arabic string'
          git push origin HEAD:${{ github.ref_name }}
